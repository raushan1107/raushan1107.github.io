<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Raushan Ranjan</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .notfound__code {
      font-family: var(--f-display);
      font-size: 8rem;
      font-weight: 700;
      color: var(--c-gold);
      opacity: 0.3;
      line-height: 1;
    }
    .notfound__title {
      font-family: var(--f-display);
      font-size: 2rem;
      color: var(--c-text);
    }
    .notfound__desc { color: var(--c-text-muted); max-width: 400px; }
  </style>
</head>
<body>
  <div class="notfound">
    <div class="notfound__code">404</div>
    <h1 class="notfound__title">Page Not Found</h1>
    <p class="notfound__desc">The page you're looking for doesn't exist. Head back to learn about Raushan Ranjan, Microsoft Certified Trainer at Koenig Solutions.</p>
    <a href="/" class="btn btn--primary">← Back to Home</a>
  </div>
</body>
</html>
